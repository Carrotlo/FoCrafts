# Public custom recipes browser GUI.
# Slots are 0-based. Inventory rows must be 1-6. Invalid slots/materials fall back safely.
# The bundled title uses Fo small caps; configured title text is preserved as written.
# Common item keys: slot, material, amount, name, lore, custom-model-data, glow, flags.

schema-version: 1
title: "ᴄᴜꜱᴛᴏᴍ ʀᴇᴄɪᴘᴇꜱ"
rows: 6

# Dynamic recipe entries render in these slots.
content-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34

filler:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

empty-content:
  material: LIGHT_GRAY_STAINED_GLASS_PANE
  name: " "

items:
  previous-page:
    slot: 45
    material: ARROW
    name: "{theme}&lPREVIOUS PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage {page}/{max_page}"
      - " "
      - "{good}→ Click to View the Previous Page ←"
  next-page:
    slot: 53
    material: ARROW
    name: "{theme}&lNEXT PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage {page}/{max_page}"
      - " "
      - "{good}→ Click to View the Next Page ←"
  search:
    slot: 51
    material: NAME_TAG
    name: "&e&lSEARCH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fCurrent: {current}"
      - " "
      - "{good}→ Click to Set a Filter ←"
    none-label: "{muted}None"
  clear-search:
    slot: 52
    material: MILK_BUCKET
    name: "{theme}&lCLEAR SEARCH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fShow all {target}."
      - " "
      - "{good}→ Click to Clear the Search ←"
    target-label: "recipes"
  back-to-craft:
    slot: 49
    material: IRON_DOOR
    name: "&e&lBACK"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fReturn to the crafting menu."
      - " "
      - "{good}→ Click to Go Back ←"
  sort:
    slot: 48
    material: CLOCK
    name: "{theme}&lSORT"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "{sort_options}"
      - " "
      - "{good}→ Click to Cycle Sort ←"
    # Valid placeholder for these lines: {sort}.
    selected-line: "{theme}» {sort}"
    unselected-line: "{white}• {sort}"
    name-ascending: "Name A-Z"
    name-descending: "Name Z-A"

# Dynamic recipe entry. The real recipe result item is used when available.
# Its material and amount are therefore recipe-owned; the fields below own its visible text and styling.
# Valid placeholders: {recipe_id}, {recipe_name}, {description}, {permission}, {type}, {match_mode}, {locked}.
recipe-item:
  name: "{theme}{recipe_name}"
  lore:
    - "{description}"
    - "{locked}"
    - "{white}Click to view this recipe."
  description-line: "{white}Desc: {theme}{description}"
  locked-line: "{bad}Locked: missing permission"

invalid-recipe-item:
  material: BARRIER
  name: "{bad}Invalid result"
  lore:
    - "{white}This recipe has no valid result item."

# Dynamic labels used by placeholders in this file. These are templates, not new behavior choices.
labels:
  no-permission: "none"
  type-shaped: "Shaped"
  type-shapeless: "Shapeless"
  match-material-only: "Material Only"
  match-material-meta: "Material + Meta"
  match-strict-all: "Strict All"
  cost-none: "none"
  cost-levels: "{amount} levels"
  cost-points: "{amount} xp"
  cost-money: "${amount}"
  cost-separator: ", "
