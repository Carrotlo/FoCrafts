# Public recipe preview GUI.
# Slots are 0-based. Inventory rows must be 1-6. Invalid slots/materials fall back safely.
# The bundled title uses Fo small caps; configured title text is preserved as written.
# Common item keys: slot, material, amount, name, lore, custom-model-data, glow, flags.

schema-version: 1
title: "ʀᴇᴄɪᴘᴇ ᴘʀᴇᴠɪᴇᴡ"
rows: 6

# The 3x3 recipe ingredient preview. Must contain exactly 9 valid slots.
grid-slots:
  - 10
  - 11
  - 12
  - 19
  - 20
  - 21
  - 28
  - 29
  - 30

result-slot: 24

filler:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

items:
  details:
    slot: 47
    material: BOOK
    name: "{theme}{recipe_name}"
    lore:
      - "{description}"
      - "{white}Costs: {theme}{cost}"
      - "{white}Status: {status}"
  back:
    slot: 49
    material: IRON_DOOR
    name: "&e&lBACK"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fReturn to the recipe browser."
      - " "
      - "{good}→ Click to Go Back ←"

invalid-result-item:
  material: BARRIER
  name: "{bad}Invalid result"
  lore:
    - "{white}This recipe has no valid result item."

# Applied to the real result item.
# Valid placeholders: {recipe_id}, {recipe_name}, {cost}, {permission}, {status}.
result-item:
  # Leave blank to preserve Minecraft's client-translated vanilla item name.
  # Set a template to override unnamed results. Valid placeholder: {material}.
  unnamed-name: ""
  lore:
    - "{white}This is the output item."

# Valid placeholder: {description}.
description-line: "{white}Description: {theme}{description}"

status:
  unlocked: "{good}Unlocked"
  locked: "{bad}Locked"
  world-blocked: "{bad}World restricted"

# Dynamic labels used by placeholders in this file. These are templates, not new behavior choices.
labels:
  no-permission: "none"
  type-shaped: "Shaped"
  type-shapeless: "Shapeless"
  match-material-only: "Material Only"
  match-material-meta: "Material + Meta"
  match-strict-all: "Strict All"
  cost-none: "none"
  cost-levels: "{amount} levels"
  cost-points: "{amount} xp"
  cost-money: "${amount}"
  cost-separator: ", "
